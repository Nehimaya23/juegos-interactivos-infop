<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🚀 MISIÓN: EVOLUCIÓN INSTITUCIONAL | INFOP Virtual</title><style>
:root{color-scheme:light;--blue:#12365a;--gold:#d4a83e;--ink:#193047;--bg:#edf2f7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#e8eef5,#fff5dd);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink)}.wrap{max-width:980px;margin:22px auto;padding:0 15px}.top{background:var(--blue);color:white;padding:18px 25px;border-radius:17px 17px 0 0;border-bottom:6px solid var(--gold)}.top small{color:#f4d99b;font-weight:700;letter-spacing:.09em}.top h1{font-size:clamp(22px,4vw,33px);margin:8px 0}.top p{margin:0;color:#e4edf6}.main{background:#fff;padding:clamp(18px,4vw,35px);border-radius:0 0 17px 17px;box-shadow:0 15px 45px #0e355122;min-height:500px}.progress{height:11px;background:#e6ecf1;border-radius:20px;overflow:hidden;margin:15px 0 23px}.bar{height:100%;background:linear-gradient(90deg,#c59c3b,#f4d580);transition:width .3s}.meta{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;color:#50677a;font-weight:700}.lead{font-size:18px;line-height:1.7}.scenario{background:#f3f6f9;border-left:5px solid var(--gold);padding:18px 20px;border-radius:8px;line-height:1.65;font-size:17px;margin:18px 0}.choices{display:grid;gap:12px}.choice{display:flex;align-items:center;gap:12px;text-align:left;background:white;color:var(--ink);border:2px solid #d7e2ed;border-radius:12px;padding:16px;font:inherit;font-size:16px;cursor:pointer;transition:.15s}.choice:hover:not(:disabled){border-color:#d4a83e;background:#fffaf0}.choice:disabled{cursor:default}.choice.good{background:#e9f7ee;border-color:#278653}.choice.bad{background:#fff0ee;border-color:#bd493e}.letter{background:var(--blue);color:white;border-radius:8px;min-width:36px;padding:8px;text-align:center;font-weight:800}.btn{background:var(--blue);color:white;border:0;border-radius:10px;padding:14px 22px;font:inherit;font-weight:700;cursor:pointer;margin-top:15px}.btn:hover{background:#23527b}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.alt{background:#d4a83e;color:#17324e}.feedback{padding:15px 18px;margin:16px 0;border-radius:10px;line-height:1.55}.feedback.ok{background:#e7f6ed;border:1px solid #8bcda4}.feedback.no{background:#fff0ed;border:1px solid #e7a39b}.footer{text-align:center;color:#63798b;font-size:12px;padding:15px}.order-row{display:flex;align-items:center;gap:9px;padding:11px;border:1px solid #dce5ee;border-radius:9px;margin:8px 0;background:#f8fafc}.order-row span{flex:1}.smallbtn{border:1px solid #9eb2c4;border-radius:7px;background:#fff;padding:7px 12px;cursor:pointer;font-size:18px}.smallbtn:disabled{opacity:.35}.checkrow{display:flex;gap:12px;padding:14px;border:1px solid #dce5ee;border-radius:9px;margin:9px 0;cursor:pointer}.checkrow input{width:19px;height:19px;accent-color:#12365a}.hidden{display:none}.pill{display:inline-block;padding:5px 10px;border-radius:20px;background:#e8eff6;color:#234767;font-weight:700;font-size:13px}h2{line-height:1.25}@media(max-width:550px){.wrap{margin:0;padding:0}.top,.main{border-radius:0}.choice{font-size:15px;padding:13px}.meta{font-size:13px}}
</style></head><body><div class="wrap"><header class="top"><small>INFOP VIRTUAL · FORTALECIMIENTO DE LA INTEGRIDAD · MÓDULO III · UNIDAD 5</small><h1 id="heading"></h1><p>Juego interactivo de aprendizaje</p></header><main class="main"><div class="meta"><span id="step"></span><span id="score"></span></div><div class="progress"><div class="bar" id="bar" style="width:0"></div></div><section id="view" aria-live="polite"></section></main><div class="footer">INFOP Virtual · Actividad formativa · La puntuación no se envía automáticamente a Moodle</div></div><script>
const DATA={"title": "🚀 MISIÓN: EVOLUCIÓN INSTITUCIONAL", "intro": "Tu institución necesita mejorar sus resultados. Supera cinco desafíos y demuestra que puedes observar, aprender, corregir y generar mayor valor público.", "unit": 5, "questions": [{"title": "Desafío 1 · Detectar la señal", "scenario": "Un trámite presenta retrasos frecuentes y varias personas usuarias se quejan del mismo problema. ¿Qué debería hacerse primero?", "options": ["Mantener el proceso porque siempre se ha realizado de esa manera.", "Reconocer las señales, revisar el proceso e identificar dónde se origina la dificultad.", "Esperar a que el retraso provoque un problema mayor antes de revisarlo."], "correct": 1, "type": "choice"}, {"title": "Desafío 2 · Evaluar antes de cambiar", "scenario": "Un equipo propone modificar un procedimiento porque considera que podría funcionar mejor. ¿Qué acción permite decidir responsablemente?", "options": ["Cambiarlo inmediatamente porque la propuesta parece conveniente.", "Revisar resultados, identificar causas y definir cómo se medirá el efecto del cambio.", "Descartar cualquier modificación para evitar riesgos."], "correct": 1, "type": "choice"}, {"title": "Desafío 3 · Aprender del error", "scenario": "Un mismo error administrativo se ha repetido tres veces durante el mes. ¿Cuál es la respuesta más adecuada?", "options": ["Corregir cada caso por separado y continuar trabajando igual.", "Reconocer el problema, analizar su causa, corregirlo e incorporar lo aprendido al proceso.", "Buscar quién cometió el último error y limitarse a llamarle la atención."], "correct": 1, "type": "choice"}, {"title": "Desafío 4 · Convertir información en acción", "scenario": "Una encuesta ciudadana identifica repetidamente una dificultad en la atención. ¿Qué convierte esa información en mejora?", "options": ["Archivar los resultados para conservar evidencia de la encuesta.", "Definir una acción, asignar responsable y plazo, implementarla y medir su resultado.", "Realizar otra encuesta sin intervenir sobre el problema detectado."], "correct": 1, "type": "choice"}, {"title": "Desafío 5 · Adaptarse para mejorar", "scenario": "Una institución implementa firma electrónica para agilizar procesos, pero un jefe se niega a utilizarla y mantiene un retraso de tres días.", "options": ["Mantener la firma manual porque es el procedimiento que conoce mejor.", "Solicitar capacitación, plantear dudas técnicas y facilitar una transición sin bloquear la mejora.", "Negarse al cambio hasta que otra persona asuma el nuevo sistema."], "correct": 1, "type": "choice"}]};const view=document.getElementById('view');const heading=document.getElementById('heading');const step=document.getElementById('step');const score=document.getElementById('score');const bar=document.getElementById('bar');let idx=-2,points=0,attempts=0,solved=false,order=[],checks=[];
function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function btn(text,fn,cls=''){let b=document.createElement('button');b.className='btn '+cls;b.textContent=text;b.onclick=fn;return b}
function node(tag,cls,text){let n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function update(){heading.textContent=DATA.title;step.textContent=idx<0?'Instrucciones':idx>=DATA.questions.length?'Resultado final':`Desafío ${idx+1} de ${DATA.questions.length}`;score.textContent=`${points} / ${DATA.questions.length*100} puntos`;bar.style.width=(idx<0?0:Math.min(100,100*(idx+(solved?1:0))/DATA.questions.length))+'%'}
function reset(){idx=-2;points=0;attempts=0;solved=false;show()}
function advance(){idx++;attempts=0;solved=false;show()}
function feedback(ok,detail){let f=node('div','feedback '+(ok?'ok':'no'),ok?'✓ Respuesta correcta. '+detail:'✕ Revisa tu decisión. '+detail);view.append(f);if(ok){if(attempts===0)points+=100;solved=true;view.append(btn(idx===DATA.questions.length-1?'Ver resultado':'Siguiente desafío',advance));}else{attempts++;view.append(btn('Reintentar',()=>show()));}update()}
function show(){view.replaceChildren();update();if(idx===-2){view.append(node('span','pill',`${DATA.questions.length} desafíos · ${DATA.questions.length*100} puntos posibles`),node('h2','', 'Tu misión'),node('p','lead',DATA.intro),node('p','lead','Analiza cada situación, toma una decisión y aprende con la retroalimentación.'));view.append(btn('Comenzar',advance));return}if(idx===-1){view.append(node('h2','','¿Cómo se juega?'),node('p','lead','Cada desafío vale 100 puntos. Para conseguirlos debes acertar en el primer intento. Si fallas, recibirás una pista y podrás volver a intentarlo para avanzar, pero ese desafío ya no sumará puntos.'));view.append(btn('Iniciar desafío 1',advance));return}if(idx>=DATA.questions.length){bar.style.width='100%';let level=points===500?'MISIÓN CUMPLIDA':points>=300?'BUEN PROGRESO':'SIGUE PRACTICANDO';view.append(node('span','pill','Misión finalizada'),node('h2','',level),node('p','lead',`Obtuviste ${points} de ${DATA.questions.length*100} puntos.`),node('p','lead','La integridad institucional se fortalece con decisiones conscientes y aprendizaje continuo.'));view.append(btn('Volver a jugar',reset,'alt'));return}
const q=DATA.questions[idx];view.append(node('span','pill',`100 puntos · ${q.type==='order'?'Ordena los pasos':q.type==='multi'?'Selecciona todas las opciones':'Elige una respuesta'}`),node('h2','',q.title),node('div','scenario',q.scenario));
if(q.type==='choice'){let wrap=node('div','choices');q.options.forEach((opt,i)=>{let b=node('button','choice');b.append(node('span','letter','ABCD'[i]),node('span','',opt));b.onclick=()=>{wrap.querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add(i===q.correct?'good':'bad');feedback(i===q.correct,i===q.correct?'Tu decisión responde adecuadamente a la situación.':'Considera los plazos, el impacto y la responsabilidad institucional.');};wrap.append(b)});view.append(wrap)}
if(q.type==='order'){order=[2,0,4,1,3];const render=()=>{let old=view.querySelector('.orderlist');if(old)old.remove();let list=node('div','orderlist');order.forEach((v,i)=>{let r=node('div','order-row');r.append(node('strong','',''+(i+1)+'.'),node('span','',q.options[v]));let up=node('button','smallbtn','↑'),down=node('button','smallbtn','↓');up.disabled=i===0;down.disabled=i===order.length-1;up.setAttribute('aria-label','Mover hacia arriba');down.setAttribute('aria-label','Mover hacia abajo');up.onclick=()=>{[order[i-1],order[i]]=[order[i],order[i-1]];render()};down.onclick=()=>{[order[i+1],order[i]]=[order[i],order[i+1]];render()};r.append(up,down);list.append(r)});view.insertBefore(list,view.querySelector('.verify'))};let verify=btn('Comprobar orden',()=>{let ok=order.every((v,i)=>v===i);view.querySelector('.orderlist').querySelectorAll('button').forEach(b=>b.disabled=true);verify.remove();feedback(ok,'El orden recomendado es definir, descomponer, estimar, programar y revisar.')});verify.classList.add('verify');view.append(verify);render()}
if(q.type==='multi'){checks=[];q.options.forEach((o,i)=>{let l=node('label','checkrow');let c=document.createElement('input');c.type='checkbox';c.onchange=()=>{if(c.checked)checks.push(i);else checks=checks.filter(x=>x!==i)};l.append(c,node('span','',o));view.append(l)});let v=btn('Comprobar selección',()=>{let ok=checks.length===4;view.querySelectorAll('input').forEach(x=>x.disabled=true);v.remove();feedback(ok,'Postergación, multitarea, interrupciones y falta de claridad afectan la concentración.')});view.append(v)}
}
reset();
</script></body></html>
