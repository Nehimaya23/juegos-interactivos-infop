<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>¿Acepto, rechazo o consulto? | INFOP</title><style>
:root{--navy:#15334d;--gold:#c99631;--bg:#f8f6f1;--green:#2f8665;--red:#b64b4b}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#e9edf0;color:var(--navy)}.frame{max-width:1120px;min-height:630px;margin:18px auto;background:var(--bg);border:1px solid #d7d9df;padding:20px 45px 30px;position:relative;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--gold)}.top span:last-child{color:#657381}.page{margin-left:auto;color:#7b8995;font-size:12px}.content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.intro h1,.end h1{font-size:clamp(26px,4vw,42px)}h1{margin:12px 0;color:var(--navy)}p{line-height:1.55}.subtitle{color:#607285}.btn{border:2px solid #d6bb85;background:#fff;border-radius:16px;padding:16px 22px;cursor:pointer;color:var(--navy);font-size:17px;font-weight:700;transition:.15s}.btn:hover,.btn:focus-visible{transform:translateY(-2px);outline:3px solid #d9c58f}.primary{background:var(--navy);color:white;border-color:var(--navy)}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;width:100%;margin:30px 0}.choices .btn{min-height:125px}.choices [data-answer="ACEPTAR"]{border-color:#9ac8b2;color:var(--green)}.choices [data-answer="RECHAZAR"]{border-color:#dfa1a1;color:var(--red)}.choices [data-answer="CONSULTAR"]{border-color:#e5c788;color:var(--gold)}.choices .btn:disabled{opacity:.6;cursor:default;transform:none}.case{background:white;border:2px solid #e1d4bd;border-radius:18px;padding:22px;max-width:740px;width:100%;font-size:23px;line-height:1.5;box-shadow:0 5px 15px #00000008}.case[draggable=true]{cursor:grab}.feedback{margin:16px auto;padding:16px 22px;border-radius:12px;max-width:800px;background:#f0eee7;line-height:1.5}.feedback.good{border-left:5px solid var(--green)}.feedback.bad{border-left:5px solid var(--red)}.meta{display:flex;justify-content:space-between;width:100%;max-width:800px;font-size:14px;color:#647384;margin-bottom:14px}.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px}.analysis{background:#fff8e9;border-left:4px solid var(--gold);padding:16px;max-width:760px;text-align:left;margin-top:14px}.order{display:grid;grid-template-columns:repeat(2,minmax(140px,220px));gap:14px;margin:22px}.order .btn{min-height:72px}.order .btn.selected{background:#d8e9df;border-color:var(--green)}.hidden{display:none!important}.score{font-size:27px;font-weight:bold;color:var(--gold)}@media(max-width:650px){.frame{margin:0;padding:15px;min-height:100vh}.choices{grid-template-columns:1fr;gap:10px}.choices .btn{min-height:65px}.case{font-size:19px}.top{font-size:10px}.order{grid-template-columns:1fr 1fr;gap:8px}}
</style></head><body><main class="frame"><header class="top"><span>MÓDULO I · FORTALECIMIENTO DE LA INTEGRIDAD</span><span>UNIDAD 4</span></header><section id="app" class="content" aria-live="polite"></section><footer class="page" id="page">01</footer></main><script>
const cases=[{title:'Licitación activa',prompt:'Empresa oferente paga inscripción, hospedaje y alimentación.',correct:'RECHAZAR',reason:'El ofrecimiento de una empresa participante en una licitación puede comprometer la imparcialidad y generar un conflicto de interés.'},{title:'Agilizar expediente',prompt:'Usuario ofrece un obsequio para ser atendido antes.',correct:'RECHAZAR',reason:'No corresponde aceptar un beneficio a cambio de alterar el orden o dar trato preferencial.'},{title:'Favor inmaterial',prompt:'Entidad regulada ofrece acceso preferente exclusivo por tu cargo.',correct:'RECHAZAR',reason:'Los beneficios no monetarios también pueden influir indebidamente en las decisiones del servidor público.'},{title:'Duda razonable',prompt:'No puedes determinar si el beneficio entra en una excepción.',correct:'CONSULTAR',reason:'Cuando no está claro si existe una excepción, debe consultarse con la instancia competente antes de aceptar.'}];
let step=-1,score=0,answered=false,selected=[],analyzed=false;const app=document.getElementById('app');const page=document.getElementById('page');function button(label,fn,cls=''){let b=document.createElement('button');b.className='btn '+cls;b.textContent=label;b.addEventListener('click',fn);return b}function clear(){app.innerHTML='';page.textContent=String(Math.max(1,step+2)).padStart(2,'0')}function el(tag,txt,cls){let x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;if(cls)x.className=cls;return x}function actions(...items){let d=el('div',undefined,'actions');items.forEach(x=>d.append(x));app.append(d)}function start(){step=0;score=0;answered=false;selected=[];analyzed=false;render()}function render(){clear();if(step===-1){app.classList.add('intro');app.append(el('h1','🎁 ¿ACEPTO, RECHAZO O CONSULTO?'),el('p','Clasificación de ofrecimientos · 500 puntos','subtitle'));let d=el('div',undefined,'choices');['✓ ACEPTAR','✕ RECHAZAR','? CONSULTAR'].forEach((v,i)=>{let b=button(v,()=>{});b.disabled=true;b.dataset.answer=['ACEPTAR','RECHAZAR','CONSULTAR'][i];d.append(b)});app.append(d,el('p','Antes de decidir, analiza: quién lo entrega · por qué · valor · mirada ciudadana.'));actions(button('▶ COMENZAR',start,'primary'));page.textContent='01';return}app.classList.remove('intro');if(step===5){app.append(el('h1','🏆 DECISIONES RESPONSABLES'),el('p','Has completado los 5 retos de la Unidad 4.'),el('div',score+' / 500 puntos','score'),el('p',score===500?'¡Excelente! Has protegido la imparcialidad. Insignia: DECISIÓN RESPONSABLE.':'Revisa las situaciones y vuelve a intentarlo para alcanzar los 500 puntos.'));actions(button('↻ VOLVER A JUGAR',start,'primary'));page.textContent='07';return}if(step===4){renderOrder();return}renderCase()}
function renderCase(){const c=cases[step];app.append(el('h1','Tarjeta '+(step+1)+' · '+c.title));app.append(el('div','🎁  '+c.prompt,'case'));let m=el('div',undefined,'meta');m.append(el('span','Reto '+(step+1)+' de 5'),el('span','Puntuación: '+score+' / 500'));app.append(m);let analysis=el('div','🔍 ¿Quién ofrece el beneficio? ¿Con qué propósito? ¿Qué valor tiene? ¿Cómo lo percibiría la ciudadanía?','analysis hidden');let a=button('🔍 ANALIZAR',()=>{analysis.classList.toggle('hidden');analyzed=true});app.append(a,analysis);let choices=el('div',undefined,'choices');['ACEPTAR','RECHAZAR','CONSULTAR'].forEach(v=>{let b=button(({ACEPTAR:'✓ ',RECHAZAR:'✕ ',CONSULTAR:'? '})[v]+v,()=>respond(v,choices,c));b.dataset.answer=v;choices.append(b)});app.append(choices)}function respond(v,choices,c){if(answered)return;answered=true;let ok=v===c.correct;if(ok)score+=100;choices.querySelectorAll('button').forEach(b=>b.disabled=true);let f=el('div',(ok?'✓ ¡Correcto! +100 puntos. ':'✕ Esta no es la clasificación adecuada. La respuesta esperada es '+c.correct+'. ')+c.reason,'feedback '+(ok?'good':'bad'));app.append(f);actions(button('CONTINUAR →',()=>{step++;answered=false;render()},'primary'))}
function renderOrder(){app.append(el('h1','Tarjeta 5 · Herramienta de análisis'),el('p','Selecciona las cuatro preguntas en el orden correcto.'));let m=el('div',undefined,'meta');m.append(el('span','Reto 5 de 5'),el('span','Puntuación: '+score+' / 500'));app.append(m);let status=el('p','Orden elegido: —');app.append(status);let d=el('div',undefined,'order');['VALOR','CIUDADANÍA','QUIÉN','POR QUÉ'].forEach(v=>{let b=button(v,()=>{if(answered||selected.includes(v))return;selected.push(v);b.classList.add('selected');b.disabled=true;status.textContent='Orden elegido: '+selected.join(' → ');if(selected.length===4){answered=true;let ok=selected.join('|')==='QUIÉN|POR QUÉ|VALOR|CIUDADANÍA';if(ok)score+=100;app.append(el('div',ok?'✓ ¡Orden correcto! +100 puntos.':'✕ El orden esperado es: QUIÉN → POR QUÉ → VALOR → MIRADA CIUDADANA.','feedback '+(ok?'good':'bad')));actions(button('VER RESULTADO →',()=>{step=5;answered=false;render()},'primary'))}});d.append(b)});app.append(d);actions(button('↺ REINICIAR ORDEN',()=>{if(answered)return;selected=[];render()},''))}render();
</script></body></html>
