<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🕵️ Operación: cero riesgo</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#17304b;background:#edf2f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:920px;margin:25px auto;padding:0 14px}.top{background:linear-gradient(120deg,#0c3156,#1b5681);color:white;padding:28px;border-radius:17px 17px 0 0;border-bottom:6px solid #d5ad52}.top h1{font-size:clamp(24px,4vw,36px);margin:4px 0 12px}.top p{margin:0;color:#e0eaf5}.content{background:white;padding:clamp(18px,4vw,38px);border-radius:0 0 17px 17px;min-height:430px;box-shadow:0 12px 30px #19344a1a}.bar{height:10px;background:#e5eaf0;border-radius:30px;overflow:hidden;margin:20px 0}.fill{height:100%;background:#d4a847;transition:width .3s}.meta{display:flex;justify-content:space-between;gap:12px;font-weight:700;color:#46637c}.question{font-size:clamp(19px,3vw,25px);line-height:1.45;margin:18px 0 24px}.option{display:block;width:100%;text-align:left;padding:17px;margin:11px 0;border:2px solid #cfdce7;border-radius:12px;background:#f8fbfe;color:#183d5d;cursor:pointer;font-size:17px;line-height:1.4}.option:hover,.option:focus-visible{border-color:#1a699c;background:#eaf4fa}.option:disabled{cursor:default;opacity:.65}.option.correct{border-color:#19845e;background:#e7f7ed;opacity:1}.option.wrong{border-color:#b75d44;background:#fff0ec;opacity:1}.feedback{border-radius:12px;padding:16px 19px;margin:19px 0;font-weight:600}.ok{background:#e9f7ee;color:#175b3c}.bad{background:#fff0e8;color:#8b3d25}.action{background:#153f68;color:white;border:0;border-radius:10px;padding:14px 22px;font-weight:700;font-size:16px;cursor:pointer;margin-top:12px}.action:hover{background:#0b2e4e}.muted{color:#56718a}.footer{text-align:center;padding:16px;color:#607c91;font-size:13px}@media(max-width:500px){.top{padding:20px}.content{min-height:350px}.meta{font-size:13px}}
</style></head><body><div class="wrap"><header class="top"><small>INFOP VIRTUAL · MÓDULO II · UNIDAD 4</small><h1>🕵️ Operación: cero riesgo</h1><p>Juego interactivo de decisiones éticas · 5 retos · 500 puntos</p></header><main class="content" id="app" aria-live="polite"></main><div class="footer">Fortalecimiento de la integridad · Aplicación del código de conducta ética del servidor público</div></div><script>
const questions=[{"title": "EXPEDIENTE 1 · ALERTA TEMPRANA", "question": "En una oficina, una sola persona solicita, autoriza y registra compras. Además, casi nunca existe revisión de otro funcionario. ¿Cuál es la señal de riesgo más importante?", "options": ["Falta de publicidad en redes sociales.", "Concentración de funciones y falta de supervisión.", "Exceso de inventarios físicos."], "correct": 1, "feedback": "Esta decisión protege el interés público y responde al principio ético del reto."}, {"title": "EXPEDIENTE 2 · BARRERA CORRECTA", "question": "Una unidad detecta que varios trámites se aprueban sin dejar evidencia suficiente de quién revisó la documentación y con qué criterio. ¿Qué medida preventiva responde mejor al problema?", "options": ["Eliminar las revisiones para acelerar el trámite.", "Esperar a que una auditoría detecte los errores.", "Establecer registros, autorizaciones y supervisión verificable."], "correct": 2, "feedback": "Esta decisión protege el interés público y responde al principio ético del reto."}, {"title": "EXPEDIENTE 3 · PATRIMONIO", "question": "Un servidor obligado a presentar declaración jurada patrimonial deja pasar el plazo porque considera que puede hacerlo cuando el órgano de control se la solicite. ¿Qué actuación refleja una cultura preventiva?", "options": ["Presentarla de forma oportuna y veraz dentro del plazo correspondiente.", "Presentarla únicamente si existe una investigación.", "Esperar al cese del cargo para declarar todo junto."], "correct": 0, "feedback": "Esta decisión protege el interés público y responde al principio ético del reto."}, {"title": "EXPEDIENTE 4 · ¿QUIÉN CONTROLA?", "question": "Durante la ejecución de un proyecto, la institución verifica autorizaciones, inventarios y registros. Meses después, un órgano externo revisa la gestión y el uso de los fondos. ¿Cuál interpretación es correcta?", "options": ["Ambas actuaciones son únicamente control interno.", "La primera corresponde al control interno y la segunda a fiscalización externa posterior.", "La fiscalización externa sustituye la obligación de mantener controles internos."], "correct": 1, "feedback": "Esta decisión protege el interés público y responde al principio ético del reto."}, {"title": "EXPEDIENTE 5 · CUENTAS CLARAS", "question": "Un director publica cuánto dinero recibió su proyecto, pero no explica qué resultados obtuvo, por qué tomó determinadas decisiones ni qué acciones de mejora implementará. ¿Qué falta para una verdadera rendición de cuentas?", "options": ["Explicar, justificar, asumir responsabilidad y mejorar.", "Esperar una auditoría antes de ampliar la información.", "Eliminar los informes para evitar cuestionamientos."], "correct": 0, "feedback": "Esta decisión protege el interés público y responde al principio ético del reto."}];let step=-1,score=0,locked=false;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function start(){step=0;score=0;render()}function render(){if(step===-1){app.innerHTML=`<h2>¡Bienvenido a la misión!</h2><p class="question">Analiza cada situación y selecciona la actuación que mejor protege el interés público.</p><p>Recibirás retroalimentación inmediata. Cada reto superado suma 100 puntos y puedes reintentar cuando lo necesites.</p><button class="action" onclick="start()">Comenzar juego →</button>`;return}if(step===questions.length){app.innerHTML=`<h2>🏆 ¡Misión completada!</h2><p class="question">Has superado los ${questions.length} retos.</p><h1>${score} / ${questions.length*100} puntos</h1><p>Tu compromiso con la integridad se refleja en las decisiones que tomas.</p><button class="action" onclick="start()">↻ Volver a jugar</button>`;return}locked=false;let q=questions[step];app.innerHTML=`<div class="meta"><span>Reto ${step+1} de ${questions.length}</span><span id="score">${score} / ${questions.length*100} puntos</span></div><div class="bar"><div class="fill" style="width:${step/questions.length*100}%"></div></div><h2>${esc(q.title)}</h2><p class="question">${esc(q.question)}</p><div id="answers">${q.options.map((o,i)=>`<button class="option" data-i="${i}"><b>${'ABC'[i]}.</b> ${esc(o)}</button>`).join('')}</div><div id="result" role="status"></div>`;document.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.i)))}function answer(i){if(locked)return;let q=questions[step],r=document.getElementById('result');if(i===q.correct){locked=true;score+=100;document.getElementById('score').textContent=`${score} / ${questions.length*100} puntos`;document.querySelectorAll('.option').forEach(b=>b.disabled=true);document.querySelector(`[data-i="${i}"]`).classList.add('correct');r.innerHTML=`<div class="feedback ok">✓ ¡Decisión correcta! +100 puntos<br><span style="font-weight:400">${esc(q.feedback)}</span></div><button class="action" id="next">${step===questions.length-1?'Ver resultado final':'Continuar →'}</button>`;document.getElementById('next').onclick=()=>{step++;render()}}else{document.querySelector(`[data-i="${i}"]`).classList.add('wrong');r.innerHTML=`<div class="feedback bad">Esta decisión debe revisarse. Piensa cuál opción protege mejor la legalidad, el servicio y el interés público. Puedes volver a intentarlo.</div>`;setTimeout(()=>{if(!locked){document.querySelectorAll('.option').forEach(b=>b.classList.remove('wrong'));r.innerHTML=''}},1800)}}render();
</script></body></html>
