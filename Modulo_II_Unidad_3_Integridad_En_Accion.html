<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⚡ Reto: integridad en acción</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#17304b;background:#edf2f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:920px;margin:25px auto;padding:0 14px}.top{background:linear-gradient(120deg,#0c3156,#1b5681);color:white;padding:28px;border-radius:17px 17px 0 0;border-bottom:6px solid #d5ad52}.top h1{font-size:clamp(24px,4vw,36px);margin:4px 0 12px}.top p{margin:0;color:#e0eaf5}.content{background:white;padding:clamp(18px,4vw,38px);border-radius:0 0 17px 17px;min-height:430px;box-shadow:0 12px 30px #19344a1a}.bar{height:10px;background:#e5eaf0;border-radius:30px;overflow:hidden;margin:20px 0}.fill{height:100%;background:#d4a847;transition:width .3s}.meta{display:flex;justify-content:space-between;gap:12px;font-weight:700;color:#46637c}.question{font-size:clamp(19px,3vw,25px);line-height:1.45;margin:18px 0 24px}.option{display:block;width:100%;text-align:left;padding:17px;margin:11px 0;border:2px solid #cfdce7;border-radius:12px;background:#f8fbfe;color:#183d5d;cursor:pointer;font-size:17px;line-height:1.4}.option:hover,.option:focus-visible{border-color:#1a699c;background:#eaf4fa}.option:disabled{cursor:default;opacity:.65}.option.correct{border-color:#19845e;background:#e7f7ed;opacity:1}.option.wrong{border-color:#b75d44;background:#fff0ec;opacity:1}.feedback{border-radius:12px;padding:16px 19px;margin:19px 0;font-weight:600}.ok{background:#e9f7ee;color:#175b3c}.bad{background:#fff0e8;color:#8b3d25}.action{background:#153f68;color:white;border:0;border-radius:10px;padding:14px 22px;font-weight:700;font-size:16px;cursor:pointer;margin-top:12px}.action:hover{background:#0b2e4e}.muted{color:#56718a}.footer{text-align:center;padding:16px;color:#607c91;font-size:13px}@media(max-width:500px){.top{padding:20px}.content{min-height:350px}.meta{font-size:13px}}
</style></head><body><div class="wrap"><header class="top"><small>INFOP VIRTUAL · MÓDULO II · UNIDAD 3</small><h1>⚡ Reto: integridad en acción</h1><p>Juego interactivo de decisiones éticas · 6 retos · 600 puntos</p></header><main class="content" id="app" aria-live="polite"></main><div class="footer">Fortalecimiento de la integridad · Aplicación del código de conducta ética del servidor público</div></div><script>
const questions=[{"title": "MISIÓN 1 · ATENCIÓN A LA CIUDADANÍA", "question": "Una persona llega molesta porque no comprende por qué su trámite fue devuelto. ¿Qué actuación refleja mejor un servicio íntegro?", "options": ["Indicarle que lea nuevamente los requisitos y atender al siguiente usuario.", "Escucharla, explicar con lenguaje claro la causa y orientarla sobre cómo corregir el trámite.", "Acelerar su caso para evitar que presente una queja."], "correct": 1, "feedback": "Esta decisión protege el interés público y responde al principio ético del reto."}, {"title": "MISIÓN 2 · COMUNICACIÓN RESPONSABLE", "question": "Un ciudadano solicita información institucional. Parte de los datos son públicos y otra parte está legalmente protegida. ¿Qué corresponde hacer?", "options": ["Negar toda la información para evitar riesgos.", "Entregar toda la información porque pertenece a una institución pública.", "Brindar la información pública y proteger únicamente aquella que tenga fundamento legal de reserva."], "correct": 2, "feedback": "Esta decisión protege el interés público y responde al principio ético del reto."}, {"title": "MISIÓN 3 · TRABAJO COLABORATIVO", "question": "Detectas un error en un proceso compartido que puede retrasar la atención a varios ciudadanos. ¿Cuál es la mejor respuesta?", "options": ["Comunicarlo oportunamente y coordinar con el equipo una solución.", "Ocultarlo para evitar que el área quede mal evaluada.", "Resolver solo tu parte y dejar que otra unidad descubra el problema."], "correct": 0, "feedback": "Esta decisión protege el interés público y responde al principio ético del reto."}, {"title": "MISIÓN 4 · RECURSOS PÚBLICOS", "question": "Un compañero propone utilizar un vehículo institucional para resolver un asunto personal porque está disponible. ¿Qué criterio debe orientar la decisión?", "options": ["Puede utilizarse si el recorrido es corto y no genera mucho gasto.", "Debe utilizarse únicamente para finalidades institucionales autorizadas.", "Puede utilizarse si luego se repone el combustible."], "correct": 1, "feedback": "Esta decisión protege el interés público y responde al principio ético del reto."}, {"title": "MISIÓN 5 · INTELIGENCIA ARTIFICIAL", "question": "Una herramienta de IA genera un borrador de resolución con referencias legales. Tienes poco tiempo para revisarlo. ¿Qué debes hacer?", "options": ["Firmarlo si el texto parece coherente.", "Verificar personalmente referencias, exactitud y pertinencia antes de utilizarlo.", "Pedir a la IA que confirme que su propia respuesta es correcta."], "correct": 1, "feedback": "Esta decisión protege el interés público y responde al principio ético del reto."}, {"title": "MISIÓN 6 · COMPROMISO INSTITUCIONAL", "question": "Una jefatura solicita ejecutar una instrucción que se aparta del marco legal, argumentando que es por el bien de la institución. ¿Qué representa un compromiso genuino?", "options": ["Cumplirla porque la lealtad institucional exige obediencia.", "Cumplirla si no produce un perjuicio visible.", "Mantener la legalidad y el bien común por encima de instrucciones o intereses particulares."], "correct": 2, "feedback": "Esta decisión protege el interés público y responde al principio ético del reto."}];let step=-1,score=0,locked=false;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function start(){step=0;score=0;render()}function render(){if(step===-1){app.innerHTML=`<h2>¡Bienvenido a la misión!</h2><p class="question">Analiza cada situación y selecciona la actuación que mejor protege el interés público.</p><p>Recibirás retroalimentación inmediata. Cada reto superado suma 100 puntos y puedes reintentar cuando lo necesites.</p><button class="action" onclick="start()">Comenzar juego →</button>`;return}if(step===questions.length){app.innerHTML=`<h2>🏆 ¡Misión completada!</h2><p class="question">Has superado los ${questions.length} retos.</p><h1>${score} / ${questions.length*100} puntos</h1><p>Tu compromiso con la integridad se refleja en las decisiones que tomas.</p><button class="action" onclick="start()">↻ Volver a jugar</button>`;return}locked=false;let q=questions[step];app.innerHTML=`<div class="meta"><span>Reto ${step+1} de ${questions.length}</span><span id="score">${score} / ${questions.length*100} puntos</span></div><div class="bar"><div class="fill" style="width:${step/questions.length*100}%"></div></div><h2>${esc(q.title)}</h2><p class="question">${esc(q.question)}</p><div id="answers">${q.options.map((o,i)=>`<button class="option" data-i="${i}"><b>${'ABC'[i]}.</b> ${esc(o)}</button>`).join('')}</div><div id="result" role="status"></div>`;document.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.i)))}function answer(i){if(locked)return;let q=questions[step],r=document.getElementById('result');if(i===q.correct){locked=true;score+=100;document.getElementById('score').textContent=`${score} / ${questions.length*100} puntos`;document.querySelectorAll('.option').forEach(b=>b.disabled=true);document.querySelector(`[data-i="${i}"]`).classList.add('correct');r.innerHTML=`<div class="feedback ok">✓ ¡Decisión correcta! +100 puntos<br><span style="font-weight:400">${esc(q.feedback)}</span></div><button class="action" id="next">${step===questions.length-1?'Ver resultado final':'Continuar →'}</button>`;document.getElementById('next').onclick=()=>{step++;render()}}else{document.querySelector(`[data-i="${i}"]`).classList.add('wrong');r.innerHTML=`<div class="feedback bad">Esta decisión debe revisarse. Piensa cuál opción protege mejor la legalidad, el servicio y el interés público. Puedes volver a intentarlo.</div>`;setTimeout(()=>{if(!locked){document.querySelectorAll('.option').forEach(b=>b.classList.remove('wrong'));r.innerHTML=''}},1800)}}render();
</script></body></html>
