<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔎 Detectives de la integridad | INFOP Virtual</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf0f6;color:#172a44;font:17px system-ui,Arial,sans-serif}.wrap{max-width:980px;margin:24px auto;background:white;min-height:620px;border-radius:20px;overflow:hidden;box-shadow:0 12px 42px #1c365122}header{background:linear-gradient(110deg,#073a68,#176a99);color:white;padding:22px 32px;border-bottom:7px solid #d8ac4c}header small{letter-spacing:1px}main{padding:32px}h1{font-size:clamp(25px,4vw,39px);margin:10px 0}h2{font-size:25px}p{line-height:1.6}.muted{color:#52657c}.bar{height:12px;background:#dce5ed;border-radius:10px;overflow:hidden;margin:18px 0}.fill{height:100%;background:#d8ac4c;transition:width .3s}.choices{display:grid;gap:12px;margin-top:24px}.choice,.tile{padding:17px;text-align:left;border:2px solid #cad8e5;background:#f5f9fc;border-radius:12px;color:#173c60;font:inherit;cursor:pointer}.choice:hover,.tile:hover{border-color:#2078a8;background:#e7f4fa}.choice:disabled{opacity:.65;cursor:default}.correct{border-color:#1b8a65!important;background:#e0f5eb!important}.wrong{border-color:#bf4d47!important;background:#fceae9!important}.btn{border:0;border-radius:10px;background:#0e527e;color:white;padding:13px 22px;font-weight:700;font-size:16px;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#d7a63b;color:#142a43}.feedback{border-left:5px solid #d7a63b;padding:14px 18px;margin:20px 0;background:#f8f3e7;border-radius:8px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}.score{font-weight:800;color:#c18c20}.tiles{display:grid;gap:10px;margin:20px 0}.tile{display:flex;justify-content:space-between;align-items:center;gap:12px}.tile button{border:1px solid #a7bac9;background:white;border-radius:7px;padding:7px 11px;cursor:pointer}.tile button:disabled{opacity:.3}.pill{background:#e6eff7;padding:7px 12px;border-radius:20px;font-weight:700;font-size:14px}footer{text-align:center;color:#5a6e82;padding:18px;font-size:13px}@media(max-width:650px){main{padding:20px}.wrap{margin:0;border-radius:0}.row{align-items:stretch}.btn{width:100%}}</style></head><body><div class="wrap"><header><small>INFOP VIRTUAL · FORTALECIMIENTO DE LA INTEGRIDAD</small><h1>🔎 Detectives de la integridad</h1></header><main id="app" aria-live="polite"></main><footer>Actividad educativa interactiva · INFOP Virtual · Puntuación de práctica no vinculada a Moodle</footer></div><script>const DATA={"title": "🔎 Detectives de la integridad", "intro": "Abre expedientes, identifica comunicaciones y reconstruye el procedimiento.", "unit": 5, "questions": [["Expediente 001 · La duda", "“No sé si puedo aceptar una invitación de un proveedor.”", ["CONSULTA", "QUEJA", "SUGERENCIA", "DENUNCIA"], 0, "Se solicita orientación ante una incertidumbre ética."], ["Expediente 002 · El retraso", "“Mi trámite tardó demasiado y nadie me informó.”", ["CONSULTA", "QUEJA", "SUGERENCIA", "DENUNCIA"], 1, "Expresa inconformidad con el tiempo o calidad del servicio."], ["Expediente 003 · La mejora", "“Propongo digitalizar este paso para reducir tiempos.”", ["CONSULTA", "QUEJA", "SUGERENCIA", "DENUNCIA"], 2, "Propone mejorar un proceso o servicio."], ["Expediente 004 · Algo para el café", "Una ciudadana reclama por demora y añade que un servidor insinuó que el trámite avanzaría si colaboraba “con algo para el café”.", ["CONSULTA", "QUEJA", "SUGERENCIA", "DENUNCIA"], 3, "Hay indicios de una conducta indebida: no debe tratarse solo como queja."]], "order": {"title": "Expediente 005 · Reconstruye el procedimiento", "items": ["RECEPCIÓN", "CALIFICACIÓN", "INVESTIGACIÓN + DEFENSA", "RESOLUCIÓN", "COMUNICACIÓN"], "explain": "La investigación debe respetar la confidencialidad, la defensa y el debido proceso."}};const questions=DATA.questions,order=DATA.order;let step=-1,score=0,answered=false,items=[];const app=document.getElementById('app');function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')};function base(){return `<div class="row"><span class="pill">MÓDULO I · UNIDAD ${DATA.unit}</span><span class="score">${score} / 500 puntos</span></div><div class="bar"><div class="fill" style="width:${Math.max(0,step)/5*100}%"></div></div>`}function start(){step=0;score=0;render()}function render(){if(step===-1){app.innerHTML=`<h1>${esc(DATA.title)}</h1><p>${esc(DATA.intro)}</p><p class="muted">5 retos · 100 puntos por acierto · 500 puntos posibles</p><button class="btn" onclick="start()">Comenzar juego</button>`;return}if(step===5){let label=score===500?'GUARDIÁN DE LA INTEGRIDAD':score>=400?'DEFENSOR DE LA INTEGRIDAD':score>=300?'SERVIDOR CONSCIENTE':'APRENDIZ EN FORMACIÓN';app.innerHTML=base()+`<h1>🏆 Juego completado</h1><h2>${score} de 500 puntos</h2><p>${label}</p><p>Has completado los cinco retos. Puedes repetir el juego para mejorar tu resultado.</p><button class="btn" onclick="start()">Volver a jugar</button>`;return}answered=false;if(step===4&&order){items=[...order.items].sort(()=>Math.random()-.5);if(items.every((x,i)=>x===order.items[i]))items.reverse();renderOrder();return}let q=questions[step];app.innerHTML=base()+`<h2>${esc(q[0])}</h2><p>${esc(q[1])}</p><div class="choices">${q[2].map((c,i)=>`<button class="choice" id="c${i}" onclick="choose(${i})">${esc(c)}</button>`).join('')}</div><div id="result"></div>`}function choose(i){if(answered)return;answered=true;let q=questions[step],ok=i===q[3];if(ok)score+=100;document.querySelectorAll('.choice').forEach((el,j)=>{el.disabled=true;if(j===q[3])el.classList.add('correct');else if(j===i)el.classList.add('wrong')});document.getElementById('result').innerHTML=`<div class="feedback"><strong>${ok?'✓ ¡Correcto! +100 puntos':'✕ Respuesta incorrecta · 0 puntos'}</strong><p>${esc(q[4])}</p></div><button class="btn" onclick="next()">${step===4?'Ver resultados':'Continuar →'}</button>`;document.querySelector('.score').textContent=score+' / 500 puntos'}function next(){step++;render()}function renderOrder(){app.innerHTML=base()+`<h2>${esc(order.title)}</h2><p>Ordena los elementos según la secuencia correcta. Usa las flechas para mover cada tarjeta.</p><div class="tiles">${items.map((s,i)=>`<div class="tile"><strong>${i+1}. ${esc(s)}</strong><span><button aria-label="Subir ${esc(s)}" onclick="move(${i},-1)" ${i===0?'disabled':''}>↑</button> <button aria-label="Bajar ${esc(s)}" onclick="move(${i},1)" ${i===items.length-1?'disabled':''}>↓</button></span></div>`).join('')}</div><button class="btn" onclick="checkOrder()">Comprobar orden</button><div id="result"></div>`}function move(i,d){[items[i],items[i+d]]=[items[i+d],items[i]];renderOrder()}function checkOrder(){let ok=items.every((s,i)=>s===order.items[i]);if(ok){score+=100;document.getElementById('result').innerHTML=`<div class="feedback"><strong>✓ ¡Secuencia correcta! +100 puntos</strong><p>${esc(order.explain)}</p></div><button class="btn" onclick="next()">Ver resultados</button>`;document.querySelector('.score').textContent=score+' / 500 puntos';document.querySelectorAll('.tile button,.btn').forEach(e=>e.disabled=true);document.querySelector('#result .btn').disabled=false}else{document.getElementById('result').innerHTML=`<div class="feedback"><strong>Revisa el orden.</strong><p>Vuelve a mover las tarjetas y comprueba otra vez. No se descuentan puntos.</p></div>`}}render();</script></body></html>
